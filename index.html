<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暗号資産 ポートフォリオ管理</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<meta name="theme-color" content="#07090f">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap');

  :root {
    --bg: #07090f;
    --bg2: #0c1018;
    --bg3: #111620;
    --border: #1c2535;
    --border2: #243044;
    --accent: #3b82f6;
    --accent2: #1d4ed8;
    --green: #22c55e;
    --red: #ef4444;
    --gold: #f59e0b;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #475569;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* Header */
  .header {
    background: linear-gradient(180deg, #0c1422 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 16px 12px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .logo { font-size: 10px; letter-spacing: .3em; color: var(--text3); font-family: monospace; }
  .title { font-size: 18px; font-weight: 900; }
  .update-info { font-size: 10px; color: var(--text3); font-family: monospace; margin-top: 4px; }

  /* Ticker */
  .ticker { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .ticker-item {
    display: flex; align-items: center; gap: 5px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 20px; padding: 3px 10px;
    font-size: 11px; font-family: monospace;
  }
  .tdot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: blink 1.5s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* Summary */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 14px 14px 0; }
  .scard {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
  }
  .scard.main { border-color: var(--accent2); background: linear-gradient(135deg, #0c1830, var(--bg2)); }
  .slabel { font-size: 10px; letter-spacing: .2em; color: var(--text3); margin-bottom: 3px; }
  .svalue { font-size: 20px; font-weight: 800; font-family: monospace; }
  .ssub { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* Tabs */
  .tabs { display: flex; margin: 14px 14px 12px; background: var(--bg2); border-radius: 10px; padding: 3px; border: 1px solid var(--border); }
  .tab { flex: 1; padding: 8px 0; border: none; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 500; background: transparent; color: var(--text3); font-family: 'Noto Sans JP', sans-serif; transition: all .2s; }
  .tab.active { background: var(--accent2); color: white; font-weight: 700; }

  /* Section */
  .section { margin: 0 14px; }
  .sec-title { font-size: 10px; letter-spacing: .25em; color: var(--text3); margin-bottom: 10px; font-family: monospace; }

  /* Exchange Group */
  .ex-group { margin-bottom: 16px; }
  .ex-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px; padding: 8px 12px;
    background: var(--bg3); border-radius: 8px;
    border-left: 3px solid var(--accent);
  }
  .ex-header.cc { border-left-color: var(--gold); }
  .ex-header.bj { border-left-color: var(--green); }
  .ex-header.bp { border-left-color: #a855f7; }
  .ex-name { font-size: 13px; font-weight: 700; }
  .ex-total { margin-left: auto; font-family: monospace; font-size: 13px; font-weight: 700; }

  /* Coin Row */
  .coin-row {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
    margin-bottom: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .coin-icon {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: white; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
  }
  .coin-info { flex: 1; min-width: 80px; }
  .coin-label { font-size: 14px; font-weight: 700; }
  .coin-name-small { font-size: 10px; color: var(--text3); }
  .coin-price { font-family: monospace; font-size: 12px; color: var(--text2); }

  .amount-group { display: flex; flex-direction: column; gap: 2px; min-width: 100px; }
  .amount-label { font-size: 10px; color: var(--text3); letter-spacing: .1em; }
  .amount-input {
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 6px; color: var(--text); padding: 6px 8px;
    font-family: monospace; font-size: 13px; width: 100%; outline: none;
  }
  .amount-input:focus { border-color: var(--accent); }

  .coin-result { min-width: 100px; text-align: right; }
  .result-val { font-family: monospace; font-size: 14px; font-weight: 700; }
  .result-pnl { font-size: 11px; margin-top: 2px; }

  .del-btn {
    background: transparent; border: 1px solid #2a1a1a;
    border-radius: 5px; color: #664455; padding: 4px 8px;
    cursor: pointer; font-size: 11px; flex-shrink: 0;
  }
  .del-btn:hover { border-color: var(--red); color: var(--red); }

  .add-coin-btn {
    width: 100%; background: transparent; border: 1px dashed var(--border2);
    border-radius: 8px; color: var(--text3); padding: 8px;
    cursor: pointer; font-size: 12px; margin-bottom: 6px;
    font-family: 'Noto Sans JP', sans-serif; transition: all .2s;
  }
  .add-coin-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Add coin modal area */
  .add-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .coin-select, .ex-select {
    flex: 1; min-width: 100px;
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 6px; color: var(--text); padding: 7px 8px;
    font-size: 12px; outline: none;
  }
  .btn {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none; border-radius: 8px; color: white;
    padding: 8px 16px; font-weight: 700; font-size: 13px;
    cursor: pointer; white-space: nowrap;
  }
  .btn:hover { opacity: .85; }
  .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }

  /* Margin Cards */
  .margin-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; margin-bottom: 10px;
    border-left: 3px solid var(--border);
  }
  .margin-card.long { border-left-color: var(--green); }
  .margin-card.short { border-left-color: var(--red); }

  .margin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .side-badge {
    padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: .1em;
  }
  .side-badge.long { background: #0a2a0a; border: 1px solid #16a34a; color: var(--green); }
  .side-badge.short { background: #2a0a0a; border: 1px solid #b91c1c; color: var(--red); }

  .margin-inputs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .mi-group { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 80px; }
  .mi-label { font-size: 10px; color: var(--text3); letter-spacing: .1em; }
  .mi-input, .mi-select {
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 6px; color: var(--text); padding: 7px 8px;
    font-size: 12px; font-family: monospace; outline: none; width: 100%;
  }
  .mi-input:focus, .mi-select:focus { border-color: var(--accent); }

  .margin-result { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mr-item { background: var(--bg3); border-radius: 6px; padding: 8px 10px; }
  .mr-label { font-size: 10px; color: var(--text3); letter-spacing: .1em; }
  .mr-value { font-size: 14px; font-weight: 700; font-family: monospace; }
  .mr-full { grid-column: 1 / -1; }

  .add-btn {
    width: 100%; background: transparent; border: 1px dashed var(--border2);
    border-radius: 8px; color: var(--text3); padding: 10px;
    cursor: pointer; font-size: 13px; margin-bottom: 10px;
    font-family: 'Noto Sans JP', sans-serif; transition: all .2s;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Price table */
  .price-table { width: 100%; border-collapse: collapse; }
  .price-table th { text-align: left; padding: 8px 10px; font-size: 10px; letter-spacing: .15em; color: var(--text3); border-bottom: 1px solid var(--border); font-family: monospace; font-weight: 400; }
  .price-table td { padding: 10px 10px; font-size: 13px; border-bottom: 1px solid var(--border); }
  .price-table tr:hover td { background: var(--bg3); }

  .green { color: var(--green); }
  .red { color: var(--red); }
  .mono { font-family: monospace; }

  @media (max-width: 480px) {
    .summary { grid-template-columns: 1fr 1fr; }
    .svalue { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="logo">CRYPTO PORTFOLIO</div>
      <div class="title">📊 資産管理ダッシュボード</div>
    </div>
    <button class="btn btn-sm" onclick="refreshPrices()" id="refreshBtn">🔄 価格更新</button>
  </div>
  <div class="update-info" id="updateInfo">価格取得中...</div>
  <div class="ticker" id="ticker"></div>
</div>

<!-- サマリー -->
<div class="summary">
  <div class="scard main">
    <div class="slabel">総資産評価額</div>
    <div class="svalue" id="totalAll">¥—</div>
    <div class="ssub" id="totalSub">スポット合計</div>
  </div>
  <div class="scard">
    <div class="slabel">スポット損益</div>
    <div class="svalue" id="totalPnl" style="font-size:18px;">¥—</div>
    <div class="ssub" id="totalPnlPct"></div>
  </div>
  <div class="scard">
    <div class="slabel">信用未実現損益</div>
    <div class="svalue" id="totalMargin" style="font-size:18px;">¥0</div>
    <div class="ssub">ポジション管理</div>
  </div>
</div>

<!-- タブ -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('spot')">📦 スポット</button>
  <button class="tab" onclick="switchTab('margin')">⚡ 信用</button>
  <button class="tab" onclick="switchTab('prices')">📊 価格一覧</button>
</div>

<!-- スポットタブ -->
<div id="tab-spot" class="section">
  <div class="sec-title">SPOT HOLDINGS — 取引所別</div>

  <!-- コイン追加フォーム -->
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;">
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px;font-weight:700;">＋ コインを追加</div>
    <div class="add-row">
      <select class="ex-select" id="addExchange">
        <option value="bitbank">ビットバンク</option>
        <option value="coincheck">コインチェック</option>
        <option value="binancejp">バイナンスJP</option>
        <option value="bitpoint">BITPOINT</option>
      </select>
      <select class="coin-select" id="addCoin"></select>
    </div>
    <div class="add-row">
      <div style="flex:1;">
        <div class="amount-label">保有数量</div>
        <input class="amount-input" type="number" id="addAmount" placeholder="例: 0.5" step="any">
      </div>
      <div style="flex:1;">
        <div class="amount-label">平均購入単価（円）</div>
        <input class="amount-input" type="number" id="addAvgPrice" placeholder="例: 8000000" step="any">
      </div>
    </div>
    <button class="btn" onclick="addCoin()" style="width:100%;">追加する</button>
  </div>

  <div id="spotList"></div>
</div>

<!-- 信用タブ -->
<div id="tab-margin" class="section" style="display:none;">
  <div class="sec-title">MARGIN POSITIONS — 信用取引</div>
  <div id="marginList"></div>
  <button class="add-btn" onclick="addMargin()">＋ ポジションを追加</button>
  <div class="scard" style="margin-top:4px;">
    <div class="slabel">信用合計損益</div>
    <div class="svalue" id="marginTotalCard" style="font-size:26px;">¥0</div>
  </div>
</div>

<!-- 価格一覧タブ -->
<div id="tab-prices" class="section" style="display:none;">
  <div class="sec-title">LIVE PRICES — BITBANK</div>
  <div style="overflow-x:auto;">
    <table class="price-table">
      <thead><tr><th>コイン</th><th>名称</th><th>現在価格</th></tr></thead>
      <tbody id="priceTableBody"></tbody>
    </table>
  </div>
</div>

<script>
// ────────────────────────────────
// コイン定義
// ────────────────────────────────
const COINS = [
  { id:'btc_jpy', label:'BTC', name:'ビットコイン' },
  { id:'eth_jpy', label:'ETH', name:'イーサリアム' },
  { id:'xrp_jpy', label:'XRP', name:'リップル' },
  { id:'sol_jpy', label:'SOL', name:'ソラナ' },
  { id:'doge_jpy', label:'DOGE', name:'ドージコイン' },
  { id:'ada_jpy', label:'ADA', name:'カルダノ' },
  { id:'dot_jpy', label:'DOT', name:'ポルカドット' },
  { id:'ltc_jpy', label:'LTC', name:'ライトコイン' },
  { id:'bcc_jpy', label:'BCH', name:'ビットコインキャッシュ' },
  { id:'xlm_jpy', label:'XLM', name:'ステラルーメン' },
  { id:'link_jpy', label:'LINK', name:'チェーンリンク' },
  { id:'matic_jpy', label:'MATIC', name:'ポリゴン' },
  { id:'avax_jpy', label:'AVAX', name:'アバランチ' },
  { id:'mona_jpy', label:'MONA', name:'モナコイン' },
  { id:'bat_jpy', label:'BAT', name:'ベーシックアテンション' },
  { id:'xym_jpy', label:'XYM', name:'シンボル' },
  { id:'flr_jpy', label:'FLR', name:'フレア' },
  { id:'sand_jpy', label:'SAND', name:'ザ・サンドボックス' },
  { id:'enj_jpy', label:'ENJ', name:'エンジン' },
  { id:'apt_jpy', label:'APT', name:'アプトス' },
  { id:'sui_jpy', label:'SUI', name:'スイ' },
  { id:'shib_jpy', label:'SHIB', name:'柴犬コイン' },
  { id:'pepe_jpy', label:'PEPE', name:'ペペ' },
  { id:'uni_jpy', label:'UNI', name:'ユニスワップ' },
  { id:'atom_jpy', label:'ATOM', name:'コスモス' },
  { id:'near_jpy', label:'NEAR', name:'ニア' },
  { id:'fil_jpy', label:'FIL', name:'ファイルコイン' },
  { id:'arb_jpy', label:'ARB', name:'アービトラム' },
  { id:'op_jpy', label:'OP', name:'オプティミズム' },
  { id:'rndr_jpy', label:'RNDR', name:'レンダー' },
  { id:'trx_jpy', label:'TRX', name:'トロン' },
  { id:'bnb_jpy', label:'BNB', name:'バイナンスコイン' },
  { id:'sky_jpy', label:'SKY', name:'スカイ' },
];

const EXCHANGES = {
  bitbank: { name: 'ビットバンク', cls: '' },
  coincheck: { name: 'コインチェック', cls: 'cc' },
  binancejp: { name: 'バイナンスJP', cls: 'bj' },
  bitpoint: { name: 'BITPOINT', cls: 'bp' },
};

const EX_COLORS = { bitbank: '#3b82f6', coincheck: '#f59e0b', binancejp: '#22c55e', bitpoint: '#a855f7' };

// ────────────────────────────────
// 状態
// ────────────────────────────────
let prices = {};
let spots = []; // { id, exchange, pair, label, name, amount, avgPrice }
let margins = []; // { id, pair, side, size, entry, leverage }
let midCounter = 1;

// ────────────────────────────────
// ユーティリティ
// ────────────────────────────────
function fmt(n, d=0) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('ja-JP', { minimumFractionDigits:d, maximumFractionDigits:d });
}
function fmtPrice(n) {
  if (!n) return '—';
  const v = Number(n);
  if (v >= 10000) return fmt(v, 0);
  if (v >= 10) return fmt(v, 2);
  return fmt(v, 4);
}
function pnlColor(v) { return v >= 0 ? 'var(--green)' : 'var(--red)'; }
function pnlSign(v) { return v >= 0 ? '+' : ''; }
function uid() { return Date.now() + Math.random().toString(36).slice(2); }

// ────────────────────────────────
// 価格取得
// ────────────────────────────────
async function refreshPrices() {
  const btn = document.getElementById('refreshBtn');
  btn.textContent = '取得中...'; btn.disabled = true;
  const results = {};
  await Promise.all(COINS.map(async c => {
    try {
      const res = await fetch(`https://public.bitbank.cc/${c.id}/ticker`);
      if (res.ok) {
        const d = await res.json();
        results[c.id] = parseFloat(d.data?.last);
      }
    } catch {}
  }));
  prices = results;
  updateTicker();
  updatePriceTable();
  renderSpots();
  renderMargins();
  updateSummary();
  document.getElementById('updateInfo').textContent =
    new Date().toLocaleTimeString('ja-JP') + ' 更新 (30秒毎に自動更新)';
  btn.textContent = '🔄 価格更新'; btn.disabled = false;
}

function updateTicker() {
  const show = ['btc_jpy','eth_jpy','xrp_jpy','sol_jpy','doge_jpy'];
  document.getElementById('ticker').innerHTML = show.map(p => {
    const c = COINS.find(x => x.id === p);
    return `<div class="ticker-item"><div class="tdot"></div><span style="color:var(--text3);font-size:10px;">${c.label}</span> ¥${fmtPrice(prices[p])}</div>`;
  }).join('');
}

function updatePriceTable() {
  document.getElementById('priceTableBody').innerHTML = COINS.filter(c => prices[c.id]).map(c => `
    <tr>
      <td><strong>${c.label}</strong></td>
      <td style="color:var(--text3);font-size:12px;">${c.name}</td>
      <td class="mono" style="font-weight:700;">¥${fmtPrice(prices[c.id])}</td>
    </tr>
  `).join('');
}

// ────────────────────────────────
// スポット管理
// ────────────────────────────────
function populateCoinSelect() {
  const sel = document.getElementById('addCoin');
  sel.innerHTML = COINS.map(c => `<option value="${c.id}">${c.label} - ${c.name}</option>`).join('');
}

function addCoin() {
  const exchange = document.getElementById('addExchange').value;
  const pair = document.getElementById('addCoin').value;
  const amount = parseFloat(document.getElementById('addAmount').value) || 0;
  const avgPrice = parseFloat(document.getElementById('addAvgPrice').value) || 0;
  if (!amount) { alert('保有数量を入力してください'); return; }
  const coin = COINS.find(c => c.id === pair);
  spots.push({ id: uid(), exchange, pair, label: coin.label, name: coin.name, amount, avgPrice });
  document.getElementById('addAmount').value = '';
  document.getElementById('addAvgPrice').value = '';
  saveData();
  renderSpots();
  updateSummary();
}

function updateSpotField(id, field, val) {
  spots = spots.map(s => s.id === id ? { ...s, [field]: field==='amount'||field==='avgPrice' ? parseFloat(val)||0 : val } : s);
  saveData();
  renderSpots();
  updateSummary();
}

function removeSpot(id) {
  spots = spots.filter(s => s.id !== id);
  saveData();
  renderSpots();
  updateSummary();
}

function renderSpots() {
  const el = document.getElementById('spotList');
  if (!spots.length) {
    el.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px;">上のフォームからコインを追加してください</div>';
    return;
  }

  // 取引所ごとにグループ化
  const groups = {};
  spots.forEach(s => {
    if (!groups[s.exchange]) groups[s.exchange] = [];
    groups[s.exchange].push(s);
  });

  el.innerHTML = Object.entries(groups).map(([ex, items]) => {
    const exInfo = EXCHANGES[ex];
    const exTotal = items.reduce((a, s) => {
      const p = prices[s.pair];
      return a + (p ? p * s.amount : 0);
    }, 0);

    const rows = items.map(s => {
      const price = prices[s.pair] || null;
      const val = price ? price * s.amount : null;
      const cost = s.avgPrice ? s.avgPrice * s.amount : null;
      const pnl = val && cost ? val - cost : null;
      const pct = pnl !== null && cost ? pnl / cost * 100 : null;
      const color = EX_COLORS[s.exchange] || '#3b82f6';

      return `
        <div class="coin-row">
          <div class="coin-icon" style="background:linear-gradient(135deg,${color}99,${color});">
            ${s.label.substring(0,3)}
          </div>
          <div class="coin-info">
            <div class="coin-label">${s.label}</div>
            <div class="coin-name-small">${s.name}</div>
            <div class="coin-price">¥${fmtPrice(price)}</div>
          </div>
          <div class="amount-group">
            <div class="amount-label">保有数量</div>
            <input class="amount-input" type="number" value="${s.amount}" step="any"
              onchange="updateSpotField('${s.id}','amount',this.value)" style="width:110px;">
            <div class="amount-label" style="margin-top:4px;">平均単価(円)</div>
            <input class="amount-input" type="number" value="${s.avgPrice||''}" placeholder="未入力" step="any"
              onchange="updateSpotField('${s.id}','avgPrice',this.value)" style="width:110px;">
          </div>
          <div class="coin-result">
            <div class="result-val">${val ? '¥'+fmt(val,0) : '—'}</div>
            <div class="result-pnl" style="color:${pnl!==null?pnlColor(pnl):'var(--text3)'};">
              ${pnl !== null ? pnlSign(pnl)+'¥'+fmt(pnl,0) : '—'}
              ${pct !== null ? `<br><span style="font-size:10px;">(${pnlSign(pct)}${pct.toFixed(2)}%)</span>` : ''}
            </div>
          </div>
          <button class="del-btn" onclick="removeSpot('${s.id}')">✕</button>
        </div>
      `;
    }).join('');

    return `
      <div class="ex-group">
        <div class="ex-header ${exInfo.cls}">
          <span style="width:10px;height:10px;border-radius:50%;background:${EX_COLORS[ex]};display:inline-block;flex-shrink:0;"></span>
          <span class="ex-name">${exInfo.name}</span>
          <span class="ex-total">¥${fmt(exTotal,0)}</span>
        </div>
        ${rows}
      </div>
    `;
  }).join('');
}

// ────────────────────────────────
// サマリー更新
// ────────────────────────────────
function updateSummary() {
  let totalVal = 0, totalCost = 0;
  spots.forEach(s => {
    const p = prices[s.pair];
    if (p && s.amount) { totalVal += p * s.amount; }
    if (s.avgPrice && s.amount) { totalCost += s.avgPrice * s.amount; }
  });
  const pnl = totalVal && totalCost ? totalVal - totalCost : null;
  const pct = pnl !== null && totalCost ? pnl / totalCost * 100 : null;

  document.getElementById('totalAll').textContent = totalVal ? '¥'+fmt(totalVal,0) : '¥—';
  const pnlEl = document.getElementById('totalPnl');
  pnlEl.textContent = pnl !== null ? pnlSign(pnl)+'¥'+fmt(pnl,0) : '¥—';
  pnlEl.style.color = pnl !== null ? pnlColor(pnl) : 'var(--text)';
  document.getElementById('totalPnlPct').textContent = pct !== null ? `(${pnlSign(pct)}${pct.toFixed(2)}%)` : '';

  // 信用合計
  let mTotal = 0;
  margins.forEach(m => {
    const p = prices[m.pair];
    const size = parseFloat(m.size)||0;
    const entry = parseFloat(m.entry)||0;
    if (p && size && entry) {
      mTotal += m.side === 'long' ? (p-entry)*size : (entry-p)*size;
    }
  });
  const mEl = document.getElementById('totalMargin');
  const mEl2 = document.getElementById('marginTotalCard');
  [mEl, mEl2].forEach(el => {
    el.textContent = pnlSign(mTotal)+'¥'+fmt(mTotal,0);
    el.style.color = pnlColor(mTotal);
  });
}

// ────────────────────────────────
// 信用管理
// ────────────────────────────────
function addMargin() {
  margins.push({ id: uid(), pair:'btc_jpy', side:'short', size:'', entry:'', leverage:'2' });
  saveData();
  renderMargins();
}

function updateMarginField(id, field, val) {
  margins = margins.map(m => m.id === id ? { ...m, [field]: val } : m);
  saveData();
  renderMargins();
  updateSummary();
}

function removeMargin(id) {
  margins = margins.filter(m => m.id !== id);
  saveData();
  renderMargins();
  updateSummary();
}

function renderMargins() {
  const el = document.getElementById('marginList');
  if (!margins.length) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = margins.map(m => {
    const price = prices[m.pair];
    const size = parseFloat(m.size)||0;
    const entry = parseFloat(m.entry)||0;
    const lev = parseFloat(m.leverage)||1;
    let pnl=null, margin=null, pct=null;
    if (price && size && entry) {
      pnl = m.side === 'long' ? (price-entry)*size : (entry-price)*size;
      margin = (entry*size)/lev;
      pct = pnl/margin*100;
    }
    const coinOpts = COINS.map(c => `<option value="${c.id}" ${c.id===m.pair?'selected':''}>${c.label}</option>`).join('');
    return `
      <div class="margin-card ${m.side}">
        <div class="margin-header">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <span class="side-badge ${m.side}">${m.side==='long'?'▲ LONG':'▼ SHORT'}</span>
            <strong style="font-size:15px;">${COINS.find(c=>c.id===m.pair)?.label||''}</strong>
          </div>
          <button class="del-btn" onclick="removeMargin('${m.id}')">✕</button>
        </div>
        <div class="margin-inputs">
          <div class="mi-group">
            <div class="mi-label">コイン</div>
            <select class="mi-select" onchange="updateMarginField('${m.id}','pair',this.value)">${coinOpts}</select>
          </div>
          <div class="mi-group" style="flex:0 0 80px;">
            <div class="mi-label">方向</div>
            <select class="mi-select" style="color:${m.side==='long'?'var(--green)':'var(--red)'};" onchange="updateMarginField('${m.id}','side',this.value)">
              <option value="long" ${m.side==='long'?'selected':''}>▲ LONG</option>
              <option value="short" ${m.side==='short'?'selected':''}>▼ SHORT</option>
            </select>
          </div>
          <div class="mi-group">
            <div class="mi-label">数量</div>
            <input class="mi-input" type="number" placeholder="0.1" value="${m.size}" step="any" oninput="updateMarginField('${m.id}','size',this.value)">
          </div>
          <div class="mi-group">
            <div class="mi-label">建値（円）</div>
            <input class="mi-input" type="number" placeholder="9500000" value="${m.entry}" step="any" oninput="updateMarginField('${m.id}','entry',this.value)">
          </div>
          <div class="mi-group" style="flex:0 0 70px;">
            <div class="mi-label">レバレッジ</div>
            <select class="mi-select" onchange="updateMarginField('${m.id}','leverage',this.value)">
              ${[1,2,3,4,5,10].map(l=>`<option value="${l}" ${l==m.leverage?'selected':''}>${l}x</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="margin-result">
          <div class="mr-item">
            <div class="mr-label">現在価格</div>
            <div class="mr-value">¥${fmtPrice(price)}</div>
          </div>
          <div class="mr-item">
            <div class="mr-label">必要証拠金(概算)</div>
            <div class="mr-value">${margin?'¥'+fmt(margin,0):'—'}</div>
          </div>
          <div class="mr-item mr-full">
            <div class="mr-label">未実現損益</div>
            <div class="mr-value" style="font-size:18px;color:${pnl!==null?pnlColor(pnl):'var(--text3)'};">
              ${pnl!==null?pnlSign(pnl)+'¥'+fmt(pnl,0):'—'}
              ${pct!==null?`<span style="font-size:12px;margin-left:4px;">(${pnlSign(pct)}${pct.toFixed(2)}%)</span>`:''}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
  updateSummary();
}

// ────────────────────────────────
// タブ切替
// ────────────────────────────────
function switchTab(tab) {
  ['spot','margin','prices'].forEach((t,i) => {
    document.getElementById(`tab-${t}`).style.display = t===tab ? 'block' : 'none';
    document.querySelectorAll('.tab')[i].classList.toggle('active', t===tab);
  });
}

// ────────────────────────────────
// データ保存・読込（localStorage）
// ────────────────────────────────
function saveData() {
  localStorage.setItem('portfolio_spots', JSON.stringify(spots));
  localStorage.setItem('portfolio_margins', JSON.stringify(margins));
}

function loadData() {
  try {
    const s = localStorage.getItem('portfolio_spots');
    const m = localStorage.getItem('portfolio_margins');
    if (s) spots = JSON.parse(s);
    if (m) { margins = JSON.parse(m); midCounter = margins.length + 1; }
  } catch {}
}

// ────────────────────────────────
// 初期化
// ────────────────────────────────
populateCoinSelect();
loadData();
renderSpots();
renderMargins();
updateSummary();
refreshPrices();
setInterval(refreshPrices, 30000);
</script>
</body>
</html>
